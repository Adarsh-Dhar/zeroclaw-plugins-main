name = "spl-transfer-build"
version = "0.1.0"
description = "Build an unsigned SPL token transfer transaction for a separately approved wallet workflow."
author = "Adarsh-Dhar"
# The plugin installer accepts a package-root-relative artifact name. The
# release build is copied here by the documented build command.
wasm_path = "spl_transfer_build.wasm"
capabilities = ["tool"]
permissions = ["http_client", "config_read"]

[config]
# Override to point at your own RPC (mainnet, devnet, or a private
# endpoint). Falls back to public devnet if unset — see README.
rpc_url = "https://api.devnet.solana.com/"
# Comma-separated base58 wallet owners this build-only tool may target. An
# empty value allows no recipients, so deployment fails closed by default.
allowed_recipients = ""
# Optional spending cap, in the mint's raw base units (not human-readable
# amount — a mint's `decimals` varies, so base units are the only
# unambiguous unit here). Transfers at or under this cap are built as
# `status: "auto_approved"` against a recent blockhash, same as before this
# option existed. Transfers over the cap are still built — but against a
# durable nonce, and marked `status: "requires_approval"` — so a human or a
# second agent can review before it's ever signed, without the transaction
# expiring while it waits. Leave unset (default) to auto-approve any amount
# to an allowlisted recipient, matching the tool's original behavior.
max_auto_approve_base_units = ""
